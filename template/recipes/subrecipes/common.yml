modules:
    - type: containerfile
      snippets:
        - COPY --from=ghcr.io/ublue-os/akmods:main-${OS_VERSION} /rpms /tmp/rpms
        - COPY --from=ghcr.io/ublue-os/akmods:main-${OS_VERSION} /kernel-rpms /tmp/rpms/kernel
        - RUN find /tmp/rpms
        - RUN rpm -q ublue-os-akmods-addons || dnf install -y /tmp/rpms/ublue-os/ublue-os-akmods-addons*.rpm
    - type: script
      scripts:
        - installsignedkernel.sh

    - type: dnf
      repos:
        files:
          - https://copr.fedorainfracloud.org/coprs/ublue-os/packages/repo/fedora-${OS_VERSION}/ublue-os-packages-fedora-${OS_VERSION}.repo
      install:
        packages:
          - ublue-os-udev-rules
          - ublue-os-update-services
          - ublue-os-signing
          - ublue-os-luks
          - ublue-os-just

    - type: script
      scripts:
        - installandroidudev.sh
        #- ensureautoupdates.sh
        #- addimageinfo.sh

    - type: dnf
      repos:
        files:
          - https://repo.librewolf.net/librewolf.repo
    - type: dnf
      install:
        packages:

        # environment
          - librewolf
          - tuned-ppd
          - xorg-x11-server-Xwayland
          - headsetcontrol
          - mediainfo
          - polkit
          - xfce-polkit 
          - fprintd-pam
          - xdg-user-dirs
          - dbus-tools
          - dbus-daemon
          - wl-clipboard
          - pavucontrol
          - playerctl
          - qt5-qtwayland
          - qt6-qtwayland
          - vulkan-validation-layers
          - vulkan-tools
          - google-noto-emoji-fonts
          - gnome-disk-utility
          - ddcutil
          - openssl
          - vim
          - just
          - alsa-firmware
          - p7zip
          - distrobox
          - steam-devices
          - micro
          - foot
          - emacs
          - nnn
          - zip
          - xz
          - unzip
          - p7zip
          - ripgrep
          - jq
          - eza
          - fzf
          - mtr
          - iperf3
          - dnsutils
          - ldns
          - socat
          - ipcalc

          - file
          - which
          - tree
          - sed
          - tar
          - awk
          - zstd
          - gnupg
          - just

          - btop
          - htop
          - iotop
          - iftop

          - strace
          - ltrace
          - lsof

          - sysstat
          - lm_sensors
          - ethtool
          - pciutils
          - usbutils
          - powerstat
          
        # sound
          - wireplumber
          - pipewire
          - pamixer
          - pulseaudio-utils

        # networking
          - network-manager-applet
          - NetworkManager-openvpn
          - NetworkManager-openvpn-gnome
          - NetworkManager-openconnect
          - NetworkManager-openconnect-gnome
          - bluez
          - bluez-tools
          - blueman
          - firewall-config

        # file manager
          - xarchiver
          - imv
          - p7zip
          - gvfs-mtp
          - gvfs-gphoto2
          - gvfs-smb
          - gvfs-nfs
          - gvfs-fuse
          - gvfs-archive

        # screenshot
          - slurp
          - grim

        # display
          - wlr-randr
          - wlsunset
          - brightnessctl
          - kanshi

        # notifications
          - dunst

        # theme and GUI
          - fontawesome-fonts-all
          - gnome-icon-theme
          - paper-icon-theme
          - breeze-icon-theme 
          - papirus-icon-theme
      replace:
        - from-repo: fedora
          packages:
            - old: OpenCL-ICD-Loader
              new: ocl-icd

    - type: script
      scripts:
        - installrpmfusion.sh

    - type: gschema-overrides
      include:
        - zz1-wayblue-theming.gschema.override

    - type: script
      scripts:
        - addbrewjustimport.sh
